<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <clipPath id="uk-clip">
    <rect width="640" height="480"/>
  </clipPath>
  <g clip-path="url(#uk-clip)">
    <!-- Azul de fondo -->
    <rect width="640" height="480" fill="#012169"/>
    <!-- Aspa blanca (San Andrés / San Patricio ancho) -->
    <path d="M0,0 L640,480 M640,0 L0,480" stroke="#FFFFFF" stroke-width="80"/>
    <!-- Aspa roja (San Patricio contrahecho) -->
    <path d="M0,0 L320,240 M640,480 L320,240" stroke="#C8102E" stroke-width="26.6" transform="translate(0, 16)"/>
    <path d="M0,480 L320,240 M640,0 L320,240" stroke="#C8102E" stroke-width="26.6" transform="translate(-16, 0)"/>
    <!-- Cruz blanca de San Jorge (base) -->
    <rect x="256" width="128" height="480" fill="#FFFFFF"/>
    <rect y="176" width="640" height="128" fill="#FFFFFF"/>
    <!-- Cruz roja de San Jorge -->
    <rect x="280" width="80" height="480" fill="#C8102E"/>
    <rect y="200" width="640" height="80" fill="#C8102E"/>
  </g>
</svg>
