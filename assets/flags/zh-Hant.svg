<svg shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <!-- Rayo de sol -->
    <polygon id="tw-ray" points="160,50 152,90 168,90" fill="#FFFFFF"/>
  </defs>
  <rect width="640" height="480" fill="#FE0000"/>
  <!-- Cantón azul -->
  <rect width="320" height="240" fill="#000095"/>
  <!-- Sol blanco de 12 puntas -->
  <g transform="translate(0, 0)">
    <!-- 12 rayos girados cada 30 grados -->
    <use href="#tw-ray" transform="rotate(0, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(30, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(60, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(90, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(120, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(150, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(180, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(210, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(240, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(270, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(300, 160, 120)"/>
    <use href="#tw-ray" transform="rotate(330, 160, 120)"/>
    <!-- Anillo azul divisor -->
    <circle cx="160" cy="120" r="38" fill="#000095"/>
    <!-- Disco solar blanco central -->
    <circle cx="160" cy="120" r="30" fill="#FFFFFF"/>
  </g>
</svg>
